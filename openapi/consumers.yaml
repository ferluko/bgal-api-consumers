openapi: 3.0.3
info:
  title: API Consumers
  version: 0.4.0-draft
  description: |
    Identidad del consumidor: una credencial (App ID / App Key) por namespace **y tenant**, su alta, baja y rotación.
    Es el **único** servicio que escribe credenciales en Vault, con la convención de DevSecOps (06/10 y 07/10):
    `openshift-<ambiente>/<namespace>/secret-apim-<tenant>-v2` (KV v2; el primer segmento es el mount), con las
    claves `app_id_<tenant>` y `app_key_<tenant>`. El ambiente sale del `environment` del pedido (QA → `qas`).
    En EKS (0.4.0), `eks-<eksCluster>/<namespace>/secret-apim-<tenant>-v2`.
    Cada recurso de un consumidor se identifica por namespace + `environment` + `tenant` (query) y, en EKS, también
    `platform=eks` + `eksCluster`.
    No escribe en Git ni en los clusters. Spec: ../README.md · ADR-api-consumers-y-subscriber-sin-estado.md
    (D1, D3, D4, D5) · ADR-gitops-apis-y-boveda.md §6.

    **Nunca devuelve ni registra el App Key**, y **no lo lee de Vault**: lo genera (o lo importa de 3scale) y lo
    escribe. **Excepción (29/10, 0.3.0):** la lee solo para dar de alta la application de una suscripción en 3scale
    con la misma key (y agregarle la key nueva en una rotación); con el mismo AppRole, y en el código solo desde el
    cliente de 3scale. Su policy es `create/read/update` sobre `openshift-<amb>/data/+/secret-apim-*`, `read/list/update` sobre
    `openshift-<amb>/metadata/...` y `create` (con `cas`) sobre el índice en `apim-<tier>`; sin `delete` ni `destroy`.

    Cambios 0.2.0 (07/10): path de Vault de DevSecOps; credencial por namespace × tenant; `environment` y `tenant`
    en el alta y como query en los recursos del consumidor; `secret-apim-<tenant>`; la ventana de rotación en el API
    Subscriber también es por tenant.

    **Sin estado propio.** El estado del consumidor y de la rotación vive en la `custom_metadata` del secreto en
    Vault (`app_id`, sigla, owner, `state`, `created_at`, `idempotency_key`, `request_hash`, `rotation_*`).
    Unicidad atómica con índices escritos con `cas=0`: `index/app-ids/<app_id>` y `index/key-fp/<sha256(app_key)>`
    (colisión de keys importadas, H-03).

    **Rotación coordinada con el API Subscriber** (D4): (1) se fija la versión N vigente; (2) el Subscriber abre el
    solapamiento (`-prev` fijados a N) y confirma `SecretSynced`; (3) recién ahí se escribe la versión N+1 con
    `cas=N` y se pide el refresh de los Secrets principales; (4) el consumidor adopta la key nueva y se completa;
    el Subscriber cierra el solapamiento. Después de (3) no hay abort: se completa y, si hace falta, se rota de
    nuevo (roll-forward). El avance lo hace la réplica líder (`Lease` de Kubernetes) a partir del estado en la
    metadata de Vault, con el callback del API Subscriber o, si no llega, por poll de su operación.

    **Convivencia con 3scale:** si `threescale.syncCredentials` es true, alta, rotación y baja también actualizan
    la aplicación de 3scale del proyecto.

    **Credenciales preexistentes (0.2.2):** una credencial que ya está en Vault pero que no creó ni importó la API
    Consumers (no tiene su metadata: ni `created_by` ni `app_id`) se informa como `Unmanaged`. Rotarla o darla de baja
    escribiría un `app_id` vacío y le rompería la credencial al consumidor, así que esas operaciones dan 409 hasta que
    se adopte.

    **Cambios 0.4.0 (25/11):**
    - **Plataforma del consumidor.** El alta recibe `platform` (`openshift`, default, o `eks`) y, con `eks`,
      `eksCluster`, el nombre del cluster de EKS (`arqc-delta-136`, `arqc-epsilon-136`, `apps-qa-use1-01`,
      `apps-prd-use1-01`…; no se valida contra una lista). En EKS cada cluster tiene su namespace de Vault
      (`admin/eks-<cluster>`) con un KV por namespace, y el ambiente no va en el path:
      `eks-<eksCluster>/<namespace>/data/secret-apim-<tenant>-v2` (`APICON_EKS_CREDENTIAL_PATH_TEMPLATE`). Los
      recursos de un consumidor de EKS llevan `platform=eks&eksCluster=<cluster>` en la query; sin `platform`, son
      los de OpenShift (lo que pide el API Subscriber). La credencial de OpenShift y la de EKS del mismo namespace,
      ambiente y tenant son dos (un namespace migrado tiene una en cada path). `STG` es `int`. La policy de la API
      Consumers suma lo mismo sobre `eks-<cluster>/…` en cada namespace de Vault de EKS (pedido a DevSecOps).
    - **Onboarding de credenciales preexistentes (adopción).** `POST /v1/consumers/{namespace}/adoption`: el pipeline
      de DevSecOps crea la credencial en Vault (hoy con el App ID y el App Key de 3scale) y llama acá con el App ID;
      la API Consumers escribe su metadata (`origin: adopted`) y reserva el App ID en el índice, sin leer ni tocar
      los datos. `PATCH` corrige el App ID de una adopción. `dryRun=true` muestra lo que haría sin escribir. Es lo
      que hacía `deploy/scripts/adopt-credential.sh`, que sigue como envoltorio.
    - **Dueño de la reserva del App ID.** `index/app-ids/<app_id>` guarda en su metadata el namespace y el tenant
      que lo reservaron: la adopción de la otra copia de un namespace migrado (el mismo App ID en otro path) la
      comparte; una de otro consumidor da 409.

    **3scale (0.3.0, 29/10):** el API Subscriber 0.11.0 decide en qué clusters de 3scale se suscribe un consumidor
    (legacy apps0: solo 3scale; multicluster appsN: 3scale y Kuadrant) y pide acá la application: una por servicio
    (API) en la cuenta de la sigla, con el app_id y la app_key de la credencial, en el admin de 3scale de ese cluster
    (uno por cluster y tenant, también en el par pg/mz). Los admins permitidos y sus tokens son configuración
    (`APICON_THREESCALE_ADMINS`, `APICON_THREESCALE_TOKENS`): un cluster sin admin da 422. En una rotación, la key
    nueva se agrega a esas applications (3scale admite varias: es el solapamiento) y al completar se sacan las demás.
servers:
  - url: https://api-consumers.apim.<dominio-interno>
security:
  - oidc: []
tags:
  - name: consumers
  - name: adoption
  - name: rotations
  - name: threescale
paths:
  /v1/consumers:
    post:
      tags: [consumers]
      summary: Alta de un namespace consumidor. Genera App ID/App Key en Vault, o los importa de 3scale.
      description: |
        Lo invoca el flujo de alta de proyecto (Null en EKS, DevOps Connect / DevSecOps on-prem) al crear el namespace.
        Sincrónica: al responder, la credencial está en Vault. La key nace en Vault; ESO la baja al cluster.
        Misma `Idempotency-Key` y mismo payload = misma respuesta (200); con otro payload = 422.
      operationId: createConsumer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsumerRequest' }
      responses:
        '201':
          description: Credencial creada. Incluye el ExternalSecret secret-apim renderizado para que el flujo de onboarding lo commitee (ADR-gitops §5.4, opción C-a).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consumer' }
        '200':
          description: Reintento idempotente de un alta ya hecha.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consumer' }
        '409':
          description: El namespace ya tiene credencial (también si es preexistente y no administrada), o la key importada colisiona con la de otro consumidor.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Payload inválido, o la misma Idempotency-Key con otro payload.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/consumers/{namespace}:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Environment'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/EksCluster'
    get:
      tags: [consumers]
      summary: Referencia de la credencial (App ID, path y versión en Vault, estado). Nunca el App Key. La usa el API Subscriber para el label app-id.
      operationId: getConsumer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consumer' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [consumers]
      summary: Baja del consumidor. Escribe una versión tombstone (sin app_key) y state=revoked; las versiones previas quedan para auditoría.
      description: |
        Sincrónica. Antes consulta al API Subscriber (`GET /v1/subscriptions?consumerNamespace=`): con
        suscripciones vivas, 409. Con una rotación en curso, 409.
      operationId: deleteConsumer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Revocado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consumer' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tiene suscripciones vivas o una rotación en curso, o la credencial es preexistente y no la administra la API Consumers (Unmanaged).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/consumers/{namespace}/secret-apim:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Environment'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/EksCluster'
    get:
      tags: [consumers]
      summary: ExternalSecret secret-apim renderizado (mismo que devuelve el alta). Para reintentos del flujo de onboarding.
      operationId: getSecretApim
      responses:
        '200':
          description: OK
          content:
            application/yaml:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/consumers/{namespace}/adoption:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Environment'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/EksCluster'
      - $ref: '#/components/parameters/DryRun'
    post:
      tags: [adoption]
      summary: Onboarding de una credencial preexistente (Unmanaged) con el App ID que informa su dueño o DevSecOps.
      description: |
        La credencial ya está en Vault (la creó el pipeline de DevSecOps, hoy con el App ID y el App Key de 3scale) y
        la API Consumers no la administra (`state: Unmanaged`). Escribe la `custom_metadata` (`app_id`, `origin:
        adopted`, sigla, owner, plataforma) y reserva el App ID en el índice (`cas=0`). **No lee ni toca los datos**
        (D3): no hay versión nueva y la key nunca pasa por acá. Adoptada, se puede suscribir, rotar y dar de baja.
        Si el App ID ya lo reservó el mismo namespace y tenant (la otra copia de un namespace migrado de OpenShift a
        EKS), se comparte la reserva. Misma `Idempotency-Key` y mismo payload = 200; con otro payload = 422.
        Con `dryRun=true` devuelve el plan sin escribir.
      operationId: adoptConsumer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdoptionRequest' }
      responses:
        '201':
          description: Adoptada (`notes` con los avisos, p. ej. un App ID que no tiene el formato de 8 hex).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consumer' }
        '200':
          description: Reintento idempotente de una adopción hecha, o el plan de un `dryRun`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Consumer'
                  - $ref: '#/components/schemas/AdoptionPlan'
        '404':
          description: No hay credencial en el path de ese namespace, ambiente, tenant y plataforma.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: La credencial ya la administra la API Consumers (generada, importada o adoptada), o el App ID está reservado por otro consumidor o por una reserva anterior a 0.4.0 (si es de esta misma credencial, `skipIndex`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: App ID que no sirve como label, tenant, ambiente o plataforma inválidos, o la misma Idempotency-Key con otro payload.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    patch:
      tags: [adoption]
      summary: Corrige el App ID de una adopción (el informado estaba mal). Idempotente por estado.
      description: |
        Solo para credenciales adoptadas (`origin: adopted`): el App ID de una generada o importada está en los datos y
        no se corrige en la metadata. Se niega con una rotación en curso o con suscripciones vivas del namespace y
        tenant (su label `app-id` es el viejo: darlas de baja antes). Reserva el App ID correcto; con
        `releasePrevious`, borra la reserva del viejo si la hizo la adopción (la policy de la API Consumers no tiene
        delete: si Vault no lo deja, queda en `notes` y la corrección se hace igual).
      operationId: fixAdoptionAppId
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppIdFix' }
      responses:
        '200':
          description: Corregida (o ya lo estaba), o el plan de un `dryRun`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Consumer'
                  - $ref: '#/components/schemas/AdoptionPlan'
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No es una adopción, el App ID actual no es `previousAppId`, rotación en curso, suscripciones vivas, App ID correcto reservado por otro, o `releasePrevious` sin constancia de que la reserva vieja la hizo esta adopción.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: App IDs iguales o que no sirven como label.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /v1/consumers/{namespace}/rotations:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Environment'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/EksCluster'
    post:
      tags: [rotations]
      summary: Inicia una rotación coordinada con el API Subscriber (pasos 1 a 3 de D4) y la deja en AwaitingConsumer.
      description: |
        Asíncrona: responde 202 con la rotación y `Location`; el avance se consulta en el recurso o llega por callback.
        Si el consumidor no tiene suscripciones vivas, el solapamiento termina sin commit y la key nueva se escribe igual.
      operationId: startRotation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl: { type: string, format: uri }
      responses:
        '202':
          description: Rotación aceptada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rotation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ya hay una rotación en curso, el consumidor está revocado, o la credencial es preexistente y no la administra la API Consumers (Unmanaged).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
      callbacks:
        rotationState:
          '{$request.body#/callbackUrl}':
            post:
              summary: Push en cada cambio de estado relevante (AwaitingConsumer, Completed, Aborted, Failed). At-least-once; deduplicar por id + state.
              requestBody:
                required: true
                content:
                  application/json:
                    schema: { $ref: '#/components/schemas/Rotation' }
              responses:
                '2XX':
                  description: Recibido.
  /v1/consumers/{namespace}/rotations/{rotationId}:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Environment'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/EksCluster'
      - name: rotationId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [rotations]
      operationId: getRotation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rotation' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rotations]
      summary: Completa (el consumidor ya usa la key nueva; el Subscriber cierra el solapamiento) o aborta (solo antes de escribir la key nueva).
      operationId: updateRotation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [complete, abort] }
      responses:
        '202':
          description: Aceptado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rotation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            complete fuera de AwaitingConsumer, o abort después de KeyWritten (la key vieja ya no es la vigente y
            no se puede restaurar sin leerla: completar y, si hace falta, rotar de nuevo).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/consumers/{namespace}/threescale/{cluster}/applications/{apiId}:
    parameters:
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/Environment'
      - $ref: '#/components/parameters/Tenant'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/EksCluster'
      - name: cluster
        in: path
        required: true
        description: Cluster de 3scale (paas-qas, paas-apps1-prdpg…); tiene que tener admin configurado.
        schema: { type: string }
      - name: apiId
        in: path
        required: true
        schema: { type: string }
      - name: serviceId
        in: query
        description: Id del servicio en 3scale (json_ci del ticket). Si no está en ese admin, se busca por systemName.
        schema: { type: string }
      - name: systemName
        in: query
        schema: { type: string }
    get:
      tags: [threescale]
      summary: La application del consumidor para ese servicio (sin keys). 404 si no existe.
      operationId: getThreeScaleApplication
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreeScaleApplication' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Cluster sin admin de 3scale configurado o sin token, servicio inexistente en ese admin, sigla sin cuenta (y sin APICON_THREESCALE_ACCOUNT_EMAIL) o tenant/ambiente inválidos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501': { description: Sin admins de 3scale configurados. }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    put:
      tags: [threescale]
      summary: Crea la application con la key de la credencial (la lee de Vault) o, si ya existe con este app_id, le cambia el plan. Idempotente.
      description: |
        Cuenta = sigla (username); si no existe y hay `APICON_THREESCALE_ACCOUNT_EMAIL`, se crea. Plan de 3scale: el de
        system_name igual a `planId`, si no el default del servicio, si no el primero; el `planId` pedido queda en la
        descripción. Nunca devuelve la key.
      operationId: putThreeScaleApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                consumerSigla: { type: string, description: Sigla consumidora del ticket (cuenta de 3scale). }
                approvalRef: { type: string }
                name: { type: string, description: subscriptionId del API Subscriber. }
      responses:
        '200':
          description: Creada o actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreeScaleApplication' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Consumidor revocado o preexistente sin adoptar, o 3scale rechazó la application (p. ej. application_id tomado).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Cluster sin admin de 3scale configurado o sin token, servicio inexistente en ese admin, sigla sin cuenta (y sin APICON_THREESCALE_ACCOUNT_EMAIL) o tenant/ambiente inválidos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501': { description: Sin admins de 3scale configurados. }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    delete:
      tags: [threescale]
      summary: Borra la application (baja o compensación de la suscripción).
      operationId: deleteThreeScaleApplication
      responses:
        '204': { description: Borrada. }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Cluster sin admin de 3scale configurado o sin token, servicio inexistente en ese admin, sigla sin cuenta (y sin APICON_THREESCALE_ACCOUNT_EMAIL) o tenant/ambiente inválidos.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
components:
  securitySchemes:
    oidc:
      type: oauth2
      description: Client credentials (Null, DevOps Connect, pipeline de DevSecOps, API Subscriber). Autorización por sigla. A validar con Seguridad.
      flows:
        clientCredentials:
          tokenUrl: https://<idp>/token
          scopes:
            apim.consumers.write: Alta, baja y rotación de credenciales
            apim.read: Lectura (incluye al API Subscriber)
  parameters:
    Namespace:
      name: namespace
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Namespace' }
    Environment:
      name: environment
      in: query
      required: true
      description: Ambiente de la credencial, como lo informa ServiceNow (QA → openshift-qas).
      schema: { type: string, example: QA }
    Tenant:
      name: tenant
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Tenant' }
    Platform:
      name: platform
      in: query
      required: false
      description: Dónde corre el namespace consumidor (0.4.0). Sin él, openshift.
      schema: { $ref: '#/components/schemas/Platform' }
    EksCluster:
      name: eksCluster
      in: query
      required: false
      description: Con platform=eks, el cluster de EKS (eks-<eksCluster>/<namespace>/…). Obligatorio ahí; con openshift, 422.
      schema: { $ref: '#/components/schemas/EksCluster' }
    DryRun:
      name: dryRun
      in: query
      required: false
      description: Valida y devuelve lo que haría, sin escribir.
      schema: { type: boolean, default: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave de idempotencia (p. ej. RITM del alta). Queda en la custom_metadata del secreto junto con el hash del pedido.
      schema: { type: string, maxLength: 200 }
  responses:
    NotFound:
      description: No existe.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DependencyUnavailable:
      description: Vault, el API Subscriber o 3scale no disponibles; reintentar con la misma Idempotency-Key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: Error (RFC 7807).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Namespace:
      type: string
      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
    Tenant:
      type: string
      enum: [b2b, b2c]
    Platform:
      type: string
      enum: [openshift, eks]
      default: openshift
    EksCluster:
      type: string
      pattern: '^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'
      example: arqc-delta-136
    SyncState:
      type: string
      enum: [NotApplicable, Pending, InSync, Failed]
    ConsumerRequest:
      type: object
      required: [namespace, sigla, tier, environment, tenant]
      properties:
        namespace: { $ref: '#/components/schemas/Namespace' }
        sigla: { type: string }
        tier: { type: string, enum: [nonprd, prd] }
        environment: { type: string, example: QA, description: 'Ambiente del namespace (QA → openshift-qas; STG → int).' }
        tenant: { $ref: '#/components/schemas/Tenant' }
        platform: { $ref: '#/components/schemas/Platform' }
        eksCluster:
          allOf: [{ $ref: '#/components/schemas/EksCluster' }]
          description: 'Solo con platform eks, y obligatorio ahí: el path es eks-<eksCluster>/<namespace>/secret-apim-<tenant>-v2.'
        owner: { type: string }
        servicenowRef: { type: string }
        importFrom3scale:
          type: object
          description: Migración. Toma App ID/App Key existentes de 3scale en lugar de generarlos (el consumidor no cambia nada). Se verifica que la key no colisione con otra (índice key-fp).
          properties:
            tenant: { type: string }
            applicationId: { type: string }
        threescale:
          type: object
          description: Convivencia. Si syncCredentials es true, la credencial se escribe en la aplicación de 3scale del proyecto (alta, rotación y baja).
          properties:
            syncCredentials: { type: boolean, default: false }
            tenant: { type: string }
            applicationId: { type: string }
    Consumer:
      type: object
      properties:
        namespace: { $ref: '#/components/schemas/Namespace' }
        sigla: { type: string }
        tier: { type: string }
        owner: { type: string }
        environment: { type: string }
        tenant: { $ref: '#/components/schemas/Tenant' }
        platform: { $ref: '#/components/schemas/Platform' }
        eksCluster: { $ref: '#/components/schemas/EksCluster' }
        appId: { type: string, description: 'App ID (8 hex si lo generó la API Consumers o 3scale).' }
        vaultPath: { type: string, example: openshift-qas/sigla-x-qas/secret-apim-b2c-v2 }
        vaultProperty: { type: string, example: app_key_b2c, description: 'Clave del App Key dentro del secreto (nunca el valor).' }
        vaultVersion: { type: integer, description: Versión vigente de la key en KV v2 (current_version). }
        state:
          type: string
          enum: [Active, Rotating, Revoked, Unmanaged]
          description: Unmanaged = credencial preexistente en Vault que no creó ni importó la API Consumers (sin su metadata); no se puede rotar ni dar de baja hasta adoptarla.
        origin: { type: string, enum: [generated, 3scale-import, adopted] }
        createdAt: { type: string, format: date-time }
        rotatedAt: { type: string, format: date-time }
        rotationId: { type: string, description: 'Rotación en curso, si la hay.' }
        credentialSync:
          type: object
          properties:
            threescale: { $ref: '#/components/schemas/SyncState' }
        secretApimManifest: { type: string, description: ExternalSecret secret-apim-<tenant> renderizado (solo en la respuesta del alta). }
        notes:
          type: array
          items: { type: string }
          description: Avisos de una adopción o de la corrección de su App ID (solo en esas respuestas).
    AdoptionRequest:
      type: object
      required: [appId]
      properties:
        appId: { type: string, maxLength: 63, description: 'El App ID que está en los datos de la credencial (lo informa DevSecOps o el dueño). Es el label app-id de las suscripciones.' }
        sigla: { type: string, description: 'Default: el prefijo del namespace, en mayúsculas.' }
        owner: { type: string }
        servicenowRef: { type: string }
        skipIndex: { type: boolean, default: false, description: 'No reserva el App ID: solo para una reserva anterior a 0.4.0 de esta misma credencial.' }
    AppIdFix:
      type: object
      required: [appId, previousAppId]
      properties:
        appId: { type: string, maxLength: 63, description: El App ID correcto. }
        previousAppId: { type: string, maxLength: 63, description: El que quedó en la adopción. }
        releasePrevious: { type: boolean, default: false, description: Borra la reserva del App ID viejo si la hizo la adopción. }
    AdoptionPlan:
      type: object
      description: Lo que haría una adopción o una corrección (dryRun=true); no se escribió nada.
      properties:
        dryRun: { type: boolean, enum: [true] }
        mode: { type: string, enum: [adopt, fix-app-id] }
        vaultPath: { type: string }
        vaultVersion: { type: integer, description: Versión vigente (la adopción no escribe datos). }
        changes: { type: object, additionalProperties: { type: string }, description: Claves de la custom_metadata que cambiarían. }
        index: { type: string, enum: [reserved, shared, skipped], description: 'reserved: reserva el App ID; shared: ya lo reservó este namespace y tenant (otra copia); skipped: skipIndex.' }
        reserve: { type: string, description: Entrada del índice que se crearía. }
        release: { type: string, description: Entrada del índice que se borraría (releasePrevious). }
        notes: { type: array, items: { type: string } }
    ThreeScaleApplication:
      type: object
      properties:
        applicationId: { type: string, description: Id interno de 3scale. }
        appId: { type: string }
        serviceId: { type: string }
        systemName: { type: string }
        planId: { type: string, description: El plan pedido por el API Subscriber (descripción de la application). }
        threescalePlan: { type: string, description: El application plan de 3scale que se usó. }
        state: { type: string }
    Rotation:
      type: object
      properties:
        id: { type: string }
        namespace: { $ref: '#/components/schemas/Namespace' }
        environment: { type: string }
        tenant: { $ref: '#/components/schemas/Tenant' }
        state:
          type: string
          description: |
            Requested → OverlapOpening (Subscriber abre los -prev fijados a pinnedVersion) → KeyWritten (versión nueva
            en Vault) → Refreshing (Secrets principales) → AwaitingConsumer → Completing (Subscriber cierra los -prev)
            → Completed. Abort solo desde Requested u OverlapOpening (→ Aborting → Aborted). Failed con error.
          enum: [Requested, OverlapOpening, KeyWritten, Refreshing, AwaitingConsumer, Completing, Completed, Aborting, Aborted, Failed]
        pinnedVersion: { type: integer, description: Versión de KV v2 que leen los -prev (la key anterior). }
        newVersion: { type: integer, description: Versión de KV v2 con la key nueva. }
        subscriberOperationId: { type: string, description: Operación del API Subscriber en curso (abrir o cerrar el solapamiento). }
        deadline: { type: string, format: date-time, description: 'Si no se completa antes, se alerta; nunca se cierra sola.' }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        error: { $ref: '#/components/schemas/Problem' }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
