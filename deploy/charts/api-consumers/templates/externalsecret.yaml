{{- $s := .Values.apiConsumers.secrets -}}
{{- if and $s.externalSecret.enabled (not $s.existingSecret) }}
# Secretos propios del Subscriber (no de consumidores): tokens de la API, deploy key de Git,
# secreto HMAC de callbacks. Viven en Vault; ESO los materializa.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-consumers-secrets
  namespace: {{ include "apicon.ns" . }}
  labels:
    {{- include "apicon.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  refreshInterval: {{ $s.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $s.externalSecret.storeRef.kind }}
    name: {{ $s.externalSecret.storeRef.name }}
  target:
    name: api-consumers-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $s.externalSecret.path }}
{{- end }}
