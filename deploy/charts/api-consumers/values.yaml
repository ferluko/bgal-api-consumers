# =============================================================================
# Defaults del chart (capa 1). No poner acá nada específico de cluster/entorno:
# usar deploy/values/{groups,profiles,clusters}/ (misma regla de oro que gitops/README).
# =============================================================================

# Bloque estándar de gitops/values/clusters/<name>.yaml (labels gitops.bancogalicia.com.ar/*)
cluster:
  name: ""
  baseDomain: bancogalicia.com.ar
  env: ""
  domain: ""
  tier: ""
  site: ""
  prod: false

apiConsumers:
  namespace: apim-toolkit
  createNamespace: true

  image:
    repository: quay.io/ferlukobgal/bgal-api-consumers
    tag: ""                                       # default: .Chart.AppVersion
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Sin estado propio (metadata de Vault). MVP: 1 réplica hasta tener Lease para las rotaciones en curso.
  replicas: 1

  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {memory: 192Mi}

  tier: nonprd                                    # nonprd | prd → mount apim-<tier>, store vault-apim-consumer-<tier>

  config:
    workerMode: background
    workerThreads: 4
    rotationDeadlineDays: 7
    rotationPollS: 5
    rotationStepTimeoutS: 900
    threescaleMode: disabled                      # disabled | stub
    callbackRetries: 3
    logLevel: INFO

  # Applications de 3scale de las suscripciones (0.3.0, 29/10). `admins` ([{match, adminUrl}]) y `accountEmail` los
  # pasa toolkit-up.sh (bgal-api-sub) desde el chart del API Subscriber: este repo es público, acá no van hosts. Los
  # tokens de los admins, en el Secret (key threescale_tokens: JSON {"<cluster>/<tenant>": token}). Sin admins: 501.
  threescale:
    admins: []
    accountEmail: ""                              # template con {sigla}; vacío = no crea cuentas de sigla
    verify: true
    # CA de los admins de 3scale (opcional; sin nada, la de la imagen). Los de nonprod no mandan la CA intermedia
    # (H-29) y el pod no la trae: en OpenShift, injectTrustedCA monta el bundle de confianza del cluster; en otro
    # cluster, caConfigMap = un ConfigMap propio con la key ca-bundle.crt (manda sobre injectTrustedCA).
    injectTrustedCA: false
    caConfigMap: ""

  # Vault: escribe credenciales con check-and-set; lee la key solo para 3scale (excepción a D3 del 29/10). Policy:
  #   data/secret-apim-*: create, read, update · metadata: read, list, update · sin delete ni destroy
  vault:
    addr: ""                                      # REQUERIDO
    auth: kubernetes                              # kubernetes | approle | token
    k8sRole: api-consumers
    k8sMount: kubernetes
    namespace: ""                                 # namespace de HCP Vault, si aplica
    verify: true
    # Credencial del consumidor (convención de DevSecOps). Sin /data/, el primer segmento es el mount KV v2 (lab);
    # con /data/, el mount es todo lo anterior (Vault corporativo: openshift-{env}/{namespace}/data/secret-apim-{tenant}-v2).
    credentialPathTemplate: "openshift-{env}/{namespace}/secret-apim-{tenant}-v2"
    envs: {dev: dev, int: int, qa: qas, qas: qas, prd: prd}  # environment del pedido → openshift-<ambiente>
    mount: ""                                     # mount de los índices; default apim-<tier>
    indexPrefix: consumers/_index                 # índices de unicidad y registro de rotaciones (cas=0)

  # API Subscriber (ventana de rotación, suscripciones vivas). URL y token en el Secret: subscriber_url, subscriber_token.
  subscriber:
    verify: true

  eso:
    consumerStore: {kind: ClusterSecretStore, name: ""}   # default vault-apim-consumer-<tier> (secret-apim-<tenant>); sin mount fijo
    secretApimRefresh: 5m

  # Secretos propios, materializados por ESO desde el Vault de plataforma (nunca en Git). Se montan como archivos en
  # /etc/api-consumers/secrets (APICON_SECRETS_DIR). Keys: api_tokens, callback_secret,
  #   vault_role_id + vault_secret_id (approle) | vault_token (token), subscriber_url, subscriber_token
  secrets:
    externalSecret:
      enabled: true
      storeRef: {kind: ClusterSecretStore, name: ""}      # REQUERIDO si enabled
      path: ""                                            # p.ej. ocp/apim-toolkit/api-consumers
      refreshInterval: 1h
    existingSecret: ""                            # alternativa a ESO (lab)

  service:
    port: 8080

  route:
    enabled: true
    host: ""                                      # default: api-consumers-<ns>.<ingressDomain>
    ingressDomain: ""

  podSecurity:
    runAsNonRoot: true
  nodeSelector: {}
  tolerations: []
