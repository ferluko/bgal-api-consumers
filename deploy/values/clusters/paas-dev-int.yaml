# Capa 7 — paas-dev-int (máxima prioridad): la API Consumers del toolkit de INT (19/11, un toolkit por entorno), en
# kuad-kuadrantorqs-int de paas-dev, con el mismo Vault corporativo (HCP, namespace admin) que el de dev. Llama al
# API Subscriber de INT (subscriber_url del Secret) para las ventanas de rotación.
#
# La dirección del Vault NO va acá (este repo es público): la pasa bgal-api-sub/deploy/scripts/toolkit-up.sh desde
# bgal-api-sub/deploy/env/paas-dev-int.conf (--set apiConsumers.vault.addr). El Secret api-consumers-secrets (AppRole,
# tokens) sale del .env del cluster: nunca a Git.
cluster:
  name: paas-dev
  baseDomain: bancogalicia.com.ar
  env: dev
  domain: lab                                     # secretos por existingSecret (groups/domain-lab.yaml)
  tier: lower
  prod: false

apiConsumers:
  namespace: kuad-kuadrantorqs-int                # se crea antes de desplegar; lo comparte con el API Subscriber de INT
  createNamespace: false
  # Los mismos que en kuad-kuadrantorqs-dev (su LimitRange); ajustar al del namespace nuevo si es otro.
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 257Mi}
  vault:
    addr: ""                                    # vacío a propósito: sin --set falla (no toma el Vault de lab de domain-lab)
    auth: approle
    namespace: admin
    verify: true
    # Vault corporativo: namespace de Vault openshift-<ambiente> con un KV por namespace de OpenShift. El /data/
    # marca dónde termina el mount (la API Consumers parte ahí; ESO usa la key tal cual).
    credentialPathTemplate: "openshift-{env}/{namespace}/data/secret-apim-{tenant}-v2"
    mount: apim-nonprod                           # índices de unicidad (en admin existe apim-nonprod, no apim-nonprd)
  eso:
    consumerStore: {kind: ClusterSecretStore, name: vault-apim-consumer-nonprd}
  # Los admins de 3scale de nonprod no mandan la CA NoProd Intermedia; el trusted-ca-bundle de paas-dev sí la trae
  # (H-29). Admins y email de la cuenta: los pasa toolkit-up.sh (bgal-api-sub).
  threescale:
    injectTrustedCA: true
